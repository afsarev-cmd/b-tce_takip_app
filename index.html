<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aylık Ödeme Takipçisi</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React ve ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel (JSX'i tarayıcının anlaması için) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        /* Input oklarını gizle */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        /* Gecikmiş Ödeme Alarmı Animasyonu */
        @keyframes flash {
            0%, 100% { background-color: #fef2f2; border-color: #fca5a5; }
            50% { background-color: #fecaca; border-color: #ef4444; }
        }
        .animate-flash {
            animation: flash 1.5s infinite alternate;
        }
        /* Tarih input stili */
        input[type="date"] {
            position: relative;
            cursor: pointer;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        // --- İKONLAR ---
        const IconBase = ({ children, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Wallet = (props) => <IconBase {...props}><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></IconBase>;
        const TrendingDown = (props) => <IconBase {...props}><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></IconBase>;
        const CheckCircle2 = (props) => <IconBase {...props}><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></IconBase>;
        const Plus = (props) => <IconBase {...props}><path d="M5 12h14"/><path d="M12 5v14"/></IconBase>;
        const Trash2 = (props) => <IconBase {...props}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></IconBase>;
        const CheckCircle = (props) => <IconBase {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconBase>;
        const Circle = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/></IconBase>;
        const ChevronLeft = (props) => <IconBase {...props}><path d="m15 18-6-6 6-6"/></IconBase>;
        const ChevronRight = (props) => <IconBase {...props}><path d="m9 18 6-6-6-6"/></IconBase>;
        const ChevronDown = (props) => <IconBase {...props}><path d="m6 9 6 6 6-6"/></IconBase>;
        const ChevronUp = (props) => <IconBase {...props}><path d="m18 15-6-6-6 6"/></IconBase>;
        const Calendar = (props) => <IconBase {...props}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></IconBase>;
        const Clock = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconBase>;
        const RefreshCw = (props) => <IconBase {...props}><path d="M3 12a9 9 0 0 1 9-9 9.75 9 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></IconBase>;
        const History = (props) => <IconBase {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></IconBase>;
        const Edit3 = (props) => <IconBase {...props}><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></IconBase>;
        const Receipt = (props) => <IconBase {...props}><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6"/><path d="M16 12h-6"/><path d="M14 16h-4"/></IconBase>;
        const Zap = (props) => <IconBase {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></IconBase>;
        const Download = (props) => <IconBase {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></IconBase>;
        const Search = (props) => <IconBase {...props}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></IconBase>;
        const Save = (props) => <IconBase {...props}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></IconBase>;
        const X = (props) => <IconBase {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>;

        const SABIT_FATURALAR = [
            'Elektrik Faturası',
            'Su Faturası',
            'Doğalgaz Faturası',
            'Cep Telefonu',
            'İnternet Faturası',
            'Aidat'
        ];

        // Tarihi YYYY-MM-DD formatına çeviren yardımcı fonksiyon
        const formatDate = (date) => {
            const d = new Date(date);
            let month = '' + (d.getMonth() + 1);
            let day = '' + d.getDate();
            const year = d.getFullYear();

            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;

            return [year, month, day].join('-');
        }
        
        // Seçili ayın son gününü YYYY-MM-DD formatında döndürür
        const getDefaultDueDate = (date) => {
            const d = new Date(date.getFullYear(), date.getMonth() + 1, 0);
            return formatDate(d);
        }

        // Gider Satırı Bileşeni
        const GiderSatiri = ({ 
            gider, 
            editingId, 
            editForm, 
            setEditForm, 
            saveEdit, 
            cancelEdit,
            startEditing, 
            durumDegistir, 
            giderSil, 
            formatPara, 
            getKategoriRenk,
            isOverdue,
            isDueSoon,
            dateKeyLabel
        }) => {
            const formattedDate = gider.sonOdemeTarihi ? new Date(gider.sonOdemeTarihi).toLocaleDateString('tr-TR') : 'Belirtilmedi';

            let rowClass = 'bg-white border-slate-100';
            let dateBadgeClass = 'bg-slate-100 text-slate-500 border-slate-200';
            let flashIndicator = null;
            
            // Ödendi veya Gecikme durumları (Sadece düzenleme modunda değilken göster)
            const isEditing = editingId === gider.id;

            if (!isEditing) {
                if (gider.odendimi) {
                    rowClass = 'bg-emerald-50/50 border-emerald-100 opacity-75';
                } else if (isOverdue) {
                    rowClass = 'border-rose-300 animate-flash';
                    dateBadgeClass = 'bg-rose-500 text-white border-rose-600';
                    flashIndicator = <Zap className="w-4 h-4 text-rose-600 animate-pulse flex-shrink-0" />;
                } else if (isDueSoon) {
                    rowClass = 'bg-yellow-50/50 border-yellow-200 border-l-4 border-l-yellow-400';
                    dateBadgeClass = 'bg-yellow-100 text-yellow-700 border-yellow-300';
                }
            } else {
                rowClass = 'bg-indigo-50 border-indigo-200 ring-2 ring-indigo-100'; // Düzenleme modu stili
            }

            return (
                <div className={`flex flex-col sm:flex-row items-center justify-between p-4 rounded-xl border transition ${rowClass}`}>
                    <div className="flex items-center gap-4 w-full sm:w-auto mb-3 sm:mb-0 flex-grow">
                        {/* Sol Taraf: Durum İkonu veya Kategori */}
                        <button 
                            onClick={() => !isEditing && durumDegistir(gider.id)} 
                            className={`flex-shrink-0 transition-colors ${gider.odendimi ? 'text-emerald-500' : 'text-slate-300 hover:text-indigo-500'} ${isEditing ? 'opacity-50 cursor-not-allowed' : ''}`}
                            disabled={isEditing}
                        >
                            {gider.odendimi ? <CheckCircle className="w-6 h-6" /> : <Circle className="w-6 h-6" />}
                        </button>
                        
                        <div className="flex-grow">
                            {isEditing ? (
                                /* --- DÜZENLEME MODU (İSİM & TARİH) --- */
                                <div className="flex flex-col gap-2 w-full">
                                    <input 
                                        type="text" 
                                        value={editForm.baslik} 
                                        onChange={(e) => setEditForm({...editForm, baslik: e.target.value})}
                                        className="font-semibold text-slate-800 w-full p-1 border-b border-indigo-300 bg-transparent focus:outline-none"
                                        placeholder="Ödeme İsmi"
                                    />
                                    <div className="flex gap-2">
                                        <input 
                                            type="date" 
                                            value={editForm.sonOdemeTarihi} 
                                            onChange={(e) => setEditForm({...editForm, sonOdemeTarihi: e.target.value})}
                                            className="text-xs p-1 border rounded bg-white border-indigo-200 focus:outline-none"
                                        />
                                    </div>
                                </div>
                            ) : (
                                /* --- GÖRÜNTÜLEME MODU (İSİM & TARİH) --- */
                                <>
                                    <h3 className={`font-semibold text-slate-800 ${gider.odendimi ? 'line-through text-slate-500' : ''}`}>{gider.baslik}</h3>
                                    <div className="flex flex-wrap items-center gap-2 mt-1">
                                        {dateKeyLabel && (
                                            <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-200 text-slate-600 border-slate-300 border font-semibold flex items-center gap-1">
                                                <Calendar className="w-3 h-3" /> {dateKeyLabel}
                                            </span>
                                        )}
                                        <span className={`text-[10px] px-2 py-0.5 rounded-full border ${getKategoriRenk(gider.kategori)}`}>
                                            {gider.kategori}
                                            {gider.kategori === 'Kredi' && gider.altKategori && ` (${gider.altKategori})`}
                                        </span>
                                        <span className={`flex items-center gap-1 text-[10px] font-medium px-2 py-0.5 rounded-full border ${dateBadgeClass}`}>
                                            {flashIndicator}
                                            <Clock className="w-3 h-3" />
                                            {isOverdue ? 'GECİKTİ: ' : (isDueSoon ? 'YAKINDA: ' : 'Son Ödeme: ')} {formattedDate}
                                        </span>
                                    </div>
                                </>
                            )}
                        </div>
                    </div>

                    {/* Sağ Taraf: Tutar ve Aksiyon Butonları */}
                    <div className="flex items-center justify-between w-full sm:w-auto sm:gap-4 mt-2 sm:mt-0">
                        {isEditing ? (
                            /* --- DÜZENLEME MODU (TUTAR) --- */
                            <div className="flex items-center gap-2">
                                <input 
                                    type="text" 
                                    inputMode="decimal"
                                    value={editForm.tutar} 
                                    onChange={(e) => setEditForm({...editForm, tutar: e.target.value})}
                                    onKeyDown={(e) => {
                                        if (e.key === 'Enter') {
                                            e.preventDefault();
                                            saveEdit();
                                        }
                                    }}
                                    className="w-24 p-1 border-b-2 border-indigo-500 outline-none text-right font-bold text-lg text-indigo-600 bg-transparent"
                                    placeholder="0"
                                />
                            </div>
                        ) : (
                            /* --- GÖRÜNTÜLEME MODU (TUTAR) --- */
                            <span className={`font-bold text-lg ${gider.odendimi ? 'text-slate-400' : 'text-slate-700'}`}>{formatPara(gider.tutar)}</span>
                        )}
                        
                        <div className="flex items-center gap-1 ml-2">
                            {isEditing ? (
                                <>
                                    <button 
                                        onClick={saveEdit}
                                        className="p-2 rounded-full text-green-600 hover:bg-green-100 transition"
                                        title="Kaydet"
                                    >
                                        <Save className="w-5 h-5" />
                                    </button>
                                    <button 
                                        onClick={cancelEdit}
                                        className="p-2 rounded-full text-rose-500 hover:bg-rose-100 transition"
                                        title="İptal"
                                    >
                                        <X className="w-5 h-5" />
                                    </button>
                                </>
                            ) : (
                                <>
                                    <button 
                                        onClick={() => !gider.odendimi && startEditing(gider)} 
                                        disabled={gider.odendimi}
                                        className={`p-2 rounded-full transition ${gider.odendimi ? 'text-slate-200 cursor-not-allowed' : 'text-slate-400 hover:text-indigo-600 hover:bg-indigo-50'}`}
                                        title="Düzenle"
                                    >
                                        <Edit3 className="w-5 h-5" />
                                    </button>
                                    <button onClick={() => giderSil(gider.id)} className="text-slate-300 hover:text-rose-500 p-2 hover:bg-rose-50 rounded-full transition" title="Sil"><Trash2 className="w-5 h-5" /></button>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const ButceTakip = () => {
            const [seciliTarih, setSeciliTarih] = useState(new Date());
            const [tumVeriler, setTumVeriler] = useState(() => {
                const savedData = localStorage.getItem('butce_takip_v4');
                if (savedData) return JSON.parse(savedData);
                return {};
            });

            // editingId: { id: number, dateKey: string } olarak tutuyoruz
            const [editingId, setEditingId] = useState(null); 
            // editForm: Tüm düzenlenebilir alanları tutar
            const [editForm, setEditForm] = useState({ baslik: '', tutar: '', sonOdemeTarihi: '' });
            
            const [isFaturalarOpen, setIsFaturalarOpen] = useState(false);
            const [searchTerm, setSearchTerm] = useState(''); 
            const editInputRef = useRef(null);

            const initialDueDate = getDefaultDueDate(new Date());

            const [yeniGider, setYeniGider] = useState({
                baslik: '',
                tutar: '',
                kategori: 'Fatura',
                altKategori: 'İhtiyaç',
                taksitli: false,
                taksitSayisi: 1,
                sonOdemeTarihi: initialDueDate 
            });

            const getDateKey = (date) => date.toISOString().slice(0, 7);

            // GECİKMİŞ/YAKINDA VADE KONTROLÜ İÇİN YARDIMCI FONKSİYONLAR
            const getDayDiff = useCallback((dateString) => {
                if (!dateString) return Infinity;
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const dueDate = new Date(dateString);
                dueDate.setHours(0, 0, 0, 0); 
                const diffTime = dueDate.getTime() - today.getTime();
                return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            }, []);

            const checkOverdue = useCallback((gider) => {
                if (gider.odendimi) return false;
                return getDayDiff(gider.sonOdemeTarihi) < 0;
            }, [getDayDiff]);

            const checkDueSoon = useCallback((gider) => {
                if (gider.odendimi || checkOverdue(gider)) return false;
                const diffDays = getDayDiff(gider.sonOdemeTarihi);
                return diffDays >= 0 && diffDays <= 3;
            }, [checkOverdue, getDayDiff]);

            // Seçili ay değiştiğinde yeni eklenen öğenin varsayılan tarihini güncelle
            useEffect(() => {
                setYeniGider(prev => ({ 
                    ...prev, 
                    sonOdemeTarihi: getDefaultDueDate(seciliTarih) 
                }));
            }, [seciliTarih]);

            // Mevcut ay için veri yoksa, sabit faturaları yükle
            useEffect(() => {
                const key = getDateKey(seciliTarih);
                setTumVeriler(prev => {
                    if (prev[key]) return prev;
                    const sabitler = SABIT_FATURALAR.map((baslik, index) => ({
                        id: Date.now() + index + Math.random(),
                        baslik: baslik,
                        tutar: 0,
                        kategori: baslik === 'Aidat' ? 'Aidat' : 'Fatura',
                        altKategori: null,
                        odendimi: false,
                        sonOdemeTarihi: getDefaultDueDate(seciliTarih)
                    }));
                    return { ...prev, [key]: { giderler: sabitler } };
                });
            }, [seciliTarih]);

            // Veri kaydetme
            useEffect(() => {
                localStorage.setItem('butce_takip_v4', JSON.stringify(tumVeriler));
            }, [tumVeriler]);


            const getCurrentMonthData = () => {
                const key = getDateKey(seciliTarih);
                return tumVeriler[key] || { giderler: [] };
            };

            const currentData = getCurrentMonthData();
            const { giderler } = currentData;

            // --- GLOBAL ARAMA MANTIĞI VE FİLTRELEME ---
            const getFlattenedGiderler = useCallback((data) => {
                const flattened = [];
                Object.entries(data).forEach(([dateKey, monthData]) => {
                    if (monthData && monthData.giderler) {
                        monthData.giderler.forEach(gider => {
                            flattened.push({ ...gider, dateKey: dateKey });
                        });
                    }
                });
                return flattened;
            }, []);

            const allGiderler = useMemo(() => getFlattenedGiderler(tumVeriler), [tumVeriler, getFlattenedGiderler]);

            const isGlobalSearchActive = searchTerm.length > 0;

            const globalFilteredGiderler = useMemo(() => {
                if (!isGlobalSearchActive) return [];
                const term = searchTerm.toLowerCase();

                return allGiderler.filter(gider => (
                    gider.baslik.toLowerCase().includes(term) ||
                    gider.kategori.toLowerCase().includes(term) ||
                    (gider.altKategori && gider.altKategori.toLowerCase().includes(term))
                )).sort((a, b) => {
                    return new Date(a.dateKey + '-01') - new Date(b.dateKey + '-01');
                });
            }, [isGlobalSearchActive, searchTerm, allGiderler]);

            const currentMonthItems = useMemo(() => {
                if (isGlobalSearchActive) return { faturaKalemleri: [], digerKalemler: [] };
                
                const currentGiderler = currentData.giderler;
                return {
                    faturaKalemleri: currentGiderler.filter(g => SABIT_FATURALAR.includes(g.baslik)),
                    digerKalemler: currentGiderler.filter(g => !SABIT_FATURALAR.includes(g.baslik)),
                };
            }, [isGlobalSearchActive, currentData.giderler]); 

            const { faturaKalemleri, digerKalemler } = currentMonthItems;
            
            // --- GÜNCELLEME FONKSİYONLARI ---
            const updateItemInTumVeriler = useCallback((id, dateKey, updates) => {
                setTumVeriler(prev => {
                    const newVeriler = { ...prev };
                    if (newVeriler[dateKey] && newVeriler[dateKey].giderler) {
                        newVeriler[dateKey].giderler = newVeriler[dateKey].giderler.map(item =>
                            item.id === id ? { ...item, ...updates } : item
                        );
                    }
                    return newVeriler;
                });
            }, []);

            const giderSil = useCallback((id, dateKey) => {
                setTumVeriler(prev => {
                    const newVeriler = { ...prev };
                    if (newVeriler[dateKey] && newVeriler[dateKey].giderler) {
                        newVeriler[dateKey].giderler = newVeriler[dateKey].giderler.filter(item => item.id !== id);
                    }
                    return newVeriler;
                });
            }, []);

            const durumDegistir = useCallback((id, dateKey) => {
                const currentGider = tumVeriler[dateKey]?.giderler?.find(g => g.id === id);
                if (!currentGider) return;
                updateItemInTumVeriler(id, dateKey, { odendimi: !currentGider.odendimi });
            }, [tumVeriler, updateItemInTumVeriler]);

            // --- DÜZENLEME İŞLEMLERİ ---
            const startEditing = (gider) => {
                const dateKey = gider.dateKey || getDateKey(seciliTarih);
                setEditingId({ id: gider.id, dateKey: dateKey });
                // Düzenleme formunu doldur
                setEditForm({
                    baslik: gider.baslik,
                    tutar: gider.tutar === 0 ? '' : gider.tutar.toString(),
                    sonOdemeTarihi: gider.sonOdemeTarihi || getDefaultDueDate(new Date(dateKey))
                });
            };

            const cancelEdit = () => {
                setEditingId(null);
                setEditForm({ baslik: '', tutar: '', sonOdemeTarihi: '' });
            };

            const saveEdit = () => {
                if (editingId) {
                    const cleanValue = editForm.tutar.toString().replace(',', '.');
                    const yeniTutar = parseFloat(cleanValue) || 0;
                    const { id, dateKey } = editingId;
                    
                    const itemExists = tumVeriler[dateKey]?.giderler?.some(item => item.id === id);
                    if (itemExists) {
                         updateItemInTumVeriler(id, dateKey, { 
                             tutar: yeniTutar,
                             baslik: editForm.baslik,
                             sonOdemeTarihi: editForm.sonOdemeTarihi
                         });
                    }
                    setEditingId(null);
                }
            };

            // --- İstatistikler (Mevcut Aya Ait) ---
            const prevMonthInfo = useMemo(() => {
                const prevDate = new Date(seciliTarih);
                prevDate.setMonth(seciliTarih.getMonth() - 1);
                const key = getDateKey(prevDate);
                const data = tumVeriler[key];
                return {
                    data: data,
                    label: prevDate.toLocaleDateString('tr-TR', { month: 'long' }),
                    totalGider: data ? data.giderler.reduce((acc, i) => acc + i.tutar, 0) : 0,
                    totalOdenen: data ? data.giderler.filter(i => i.odendimi).reduce((acc, i) => acc + i.tutar, 0) : 0
                };
            }, [seciliTarih, tumVeriler]);
            
            const prevKalanBorc = prevMonthInfo.totalGider - prevMonthInfo.totalOdenen;
            const toplamGider = giderler.reduce((acc, item) => acc + item.tutar, 0);
            const odenenTutar = giderler.filter(item => item.odendimi).reduce((acc, item) => acc + item.tutar, 0);
            const kalanBorc = toplamGider - odenenTutar;
            const gecikenSayisi = giderler.filter(checkOverdue).length;
            const yakindaSayisi = giderler.filter(checkDueSoon).length;

            const ayDegistir = (yon) => {
                const yeniTarih = new Date(seciliTarih);
                yeniTarih.setMonth(seciliTarih.getMonth() + yon);
                setSeciliTarih(yeniTarih);
            };

            const giderEkle = (e) => {
                e.preventDefault();
                if (!yeniGider.baslik || !yeniGider.tutar) return;

                const isTaksit = yeniGider.taksitli && yeniGider.taksitSayisi > 1;
                const donguSayisi = isTaksit ? parseInt(yeniGider.taksitSayisi) : 1;
                const girilenTutar = parseFloat(yeniGider.tutar);
                const baseDate = new Date(yeniGider.sonOdemeTarihi);

                setTumVeriler(prev => {
                    const yeniVeriler = { ...prev };
                    for (let i = 0; i < donguSayisi; i++) {
                        const hedefTarih = new Date(seciliTarih);
                        hedefTarih.setMonth(hedefTarih.getMonth() + i);
                        const key = getDateKey(hedefTarih);
                        const taksitSonOdemeTarihi = new Date(baseDate);
                        taksitSonOdemeTarihi.setMonth(baseDate.getMonth() + i);
                        
                        if (!yeniVeriler[key]) {
                            const sabitler = SABIT_FATURALAR.map((baslik, idx) => ({
                                id: Date.now() + idx + Math.random(),
                                baslik: baslik,
                                tutar: 0,
                                kategori: baslik === 'Aidat' ? 'Aidat' : 'Fatura',
                                altKategori: null,
                                odendimi: false,
                                sonOdemeTarihi: getDefaultDueDate(hedefTarih)
                            }));
                            yeniVeriler[key] = { giderler: sabitler };
                        }
                        
                        const baslikMetni = isTaksit ? `${yeniGider.baslik} (${i + 1}/${donguSayisi})` : yeniGider.baslik;
                        const yeniKayit = {
                            id: Date.now() + i + Math.random(),
                            baslik: baslikMetni,
                            tutar: girilenTutar,
                            kategori: yeniGider.kategori,
                            altKategori: yeniGider.kategori === 'Kredi' ? yeniGider.altKategori : null,
                            odendimi: false,
                            sonOdemeTarihi: formatDate(taksitSonOdemeTarihi)
                        };
                        yeniVeriler[key].giderler = [...yeniVeriler[key].giderler, yeniKayit];
                    }
                    return yeniVeriler;
                });

                setYeniGider({ 
                    ...yeniGider, 
                    baslik: '', 
                    tutar: '', 
                    taksitli: false, 
                    taksitSayisi: 1, 
                    sonOdemeTarihi: getDefaultDueDate(seciliTarih) 
                });
            };

            const formatPara = (tutar) => new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY' }).format(tutar);
            const formatTarihYaziyla = (date) => date.toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' });
            
            const getKategoriRenk = (kat) => {
                switch(kat) {
                    case 'Kredi': return 'bg-purple-100 text-purple-600 border-purple-200';
                    case 'Fatura': return 'bg-blue-100 text-blue-600 border-blue-200';
                    case 'Kira': return 'bg-orange-100 text-orange-600 border-orange-200';
                    case 'Kredi Kartı': return 'bg-pink-100 text-pink-600 border-pink-200';
                    case 'Aidat': return 'bg-yellow-100 text-yellow-600 border-yellow-200';
                    default: return 'bg-gray-100 text-gray-600 border-gray-200';
                }
            };

            const exportToCsv = () => {
                const allRecords = allGiderler;
                if (allRecords.length === 0) {
                    alert('Dışa aktarılacak veri bulunamadı.');
                    return;
                }
                const headers = ['Ay_Yil', 'Baslik', 'Tutar', 'Kategori', 'Alt_Kategori', 'Son_Odeme_Tarihi', 'Durum'];
                let csv = headers.map(h => `"${h}"`).join(';') + '\n';
                
                allRecords.forEach(gider => {
                    const durum = gider.odendimi ? 'Ödendi' : (checkOverdue(gider) ? 'GECİKTİ' : 'Ödenmedi');
                    const formattedTarih = gider.sonOdemeTarihi ? new Date(gider.sonOdemeTarihi).toLocaleDateString('tr-TR') : 'YOK';
                    const monthYearLabel = gider.dateKey ? new Date(gider.dateKey + '-01').toLocaleDateString('tr-TR', { month: '2-digit', year: 'numeric' }) : 'YOK';

                    const rowData = {
                        Ay_Yil: monthYearLabel,
                        Baslik: gider.baslik.replace(/"/g, '""'), 
                        Tutar: String(gider.tutar).replace('.', ','),
                        Kategori: gider.kategori,
                        Alt_Kategori: gider.altKategori || '',
                        Son_Odeme_Tarihi: formattedTarih,
                        Durum: durum,
                    };

                    const values = headers.map(header => {
                        let value = rowData[header];
                        if (typeof value === 'string' && header !== 'Tutar') {
                            value = `"${value.replace(/"/g, '""')}"`;
                        }
                        return value;
                    });
                    csv += values.join(';') + '\n';
                });

                const blob = new Blob(["\uFEFF", csv], { type: 'text/csv;charset=utf-8;' }); 
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `Butce_Takibi_Tum_Aylar.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="min-h-screen bg-slate-50 p-4 font-sans text-slate-800">
                    <div className="max-w-4xl mx-auto space-y-6">
                        <header className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-2">
                                <div className="p-2 bg-indigo-600 rounded-lg"><Wallet className="text-white w-6 h-6" /></div>
                                <h1 className="text-xl font-bold text-slate-800">Ödeme Takipçisi</h1>
                            </div>
                            
                            <div className="flex items-center bg-slate-100 rounded-lg p-1">
                                <button onClick={() => ayDegistir(-1)} className="p-2 hover:bg-white rounded-md transition text-slate-600" disabled={isGlobalSearchActive}><ChevronLeft className="w-5 h-5" /></button>
                                <div className="px-4 font-semibold text-slate-700 min-w-[140px] text-center flex items-center justify-center gap-2">
                                    <Calendar className="w-4 h-4 text-indigo-500" />
                                    {isGlobalSearchActive ? 'Global Arama' : formatTarihYaziyla(seciliTarih)}
                                </div>
                                <button onClick={() => ayDegistir(1)} className="p-2 hover:bg-white rounded-md transition text-slate-600" disabled={isGlobalSearchActive}><ChevronRight className="w-5 h-5" /></button>
                            </div>
                        </header>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className={`bg-white p-4 rounded-xl shadow-sm flex flex-col gap-1 border-l-4 border-l-rose-500 ${gecikenSayisi > 0 ? 'border-2 border-rose-500 shadow-lg shadow-rose-200' : 'border border-slate-100'}`}>
                                <div className="flex justify-between items-start">
                                    <span className="text-xs text-slate-500 font-bold uppercase">Kalan Borç (Bu Ay)</span>
                                    {gecikenSayisi > 0 && <Zap className="w-5 h-5 text-rose-500 animate-pulse" title="Gecikmiş Ödeme Var" />}
                                    <TrendingDown className="w-4 h-4 text-rose-500 hidden sm:block" />
                                </div>
                                <span className="text-2xl font-bold text-rose-600">{formatPara(kalanBorc)}</span>
                                <div className="text-xs text-slate-400 mt-1">
                                    Ödenmesi gereken tutar
                                    {gecikenSayisi > 0 && <span className="text-rose-500 font-semibold block mt-0.5">{gecikenSayisi} Gecikmiş Ödeme!</span>}
                                    {yakindaSayisi > 0 && <span className="text-yellow-600 font-semibold block mt-0.5">{yakindaSayisi} Yakında Vadesi Geliyor!</span>}
                                </div>
                            </div>
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col gap-1 border-l-4 border-l-emerald-500">
                                <div className="flex justify-between items-start"><span className="text-xs text-slate-500 font-bold uppercase">Ödenen Tutar (Bu Ay)</span><CheckCircle2 className="w-4 h-4 text-emerald-500" /></div>
                                <span className="text-2xl font-bold text-emerald-700">{formatPara(odenenTutar)}</span>
                                <div className="text-xs text-slate-400 mt-1">Bu ay yapılan ödemeler</div>
                            </div>
                            <div className="bg-indigo-50 p-4 rounded-xl shadow-sm border border-indigo-100 flex flex-col gap-1 relative overflow-hidden">
                                <div className="absolute -right-4 -top-4 opacity-10"><History className="w-24 h-24 text-indigo-600" /></div>
                                <div className="flex justify-between items-start relative z-10">
                                    <span className="text-xs text-indigo-600 font-bold uppercase">Geçen Ay ({prevMonthInfo.label})</span>
                                </div>
                                {prevMonthInfo.data ? (
                                    <div className="relative z-10 mt-1">
                                        <div className="flex justify-between text-sm mb-1">
                                            <span className="text-indigo-400">Ödenen:</span>
                                            <span className="font-bold text-indigo-700">{formatPara(prevMonthInfo.totalOdenen)}</span>
                                        </div>
                                        <div className="flex justify-between text-sm">
                                            <span className="text-indigo-400">Ödenmeyen:</span>
                                            <span className="font-bold text-rose-500">{formatPara(prevKalanBorc)}</span>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="text-sm text-indigo-400 mt-2 relative z-10 italic">Kayıt bulunamadı.</div>
                                )}
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div className="lg:col-span-1">
                                <form onSubmit={giderEkle} className="bg-white p-5 rounded-xl shadow-sm border border-slate-100 sticky top-6">
                                    <h2 className="text-lg font-semibold mb-4 flex items-center gap-2 text-slate-700"><Plus className="w-5 h-5" /> Ödeme Ekle</h2>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-medium text-slate-500 mb-1">Açıklama / İsim</label>
                                            <input type="text" placeholder="Örn: Ev Kirası" value={yeniGider.baslik} onChange={(e) => setYeniGider({...yeniGider, baslik: e.target.value})} className="w-full p-2 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-500 mb-1">Tutar (TL)</label>
                                            <input type="number" placeholder="0.00" value={yeniGider.tutar} onChange={(e) => setYeniGider({...yeniGider, tutar: e.target.value})} className="w-full p-2 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-500 mb-1">Son Ödeme Tarihi (Takvimden Seçin)</label>
                                            <input 
                                                type="date" 
                                                value={yeniGider.sonOdemeTarihi} 
                                                onChange={(e) => setYeniGider({...yeniGider, sonOdemeTarihi: e.target.value})} 
                                                className="w-full p-2 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500" 
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-500 mb-1">Kategori</label>
                                            <select value={yeniGider.kategori} onChange={(e) => setYeniGider({...yeniGider, kategori: e.target.value})} className="w-full p-2 border border-slate-200 rounded-lg bg-white">
                                                <option value="Kredi">Kredi</option>
                                                <option value="Fatura">Fatura</option>
                                                <option value="Kira">Kira</option>
                                                <option value="Kredi Kartı">Kredi Kartı</option>
                                                <option value="Aidat">Aidat</option>
                                                <option value="Diğer">Diğer</option>
                                            </select>
                                        </div>
                                        {yeniGider.kategori === 'Kredi' && (
                                            <div className="bg-purple-50 p-3 rounded-lg border border-purple-100 animate-fade-in">
                                                <label className="block text-xs font-medium text-purple-700 mb-1">Kredi Türü</label>
                                                <select value={yeniGider.altKategori} onChange={(e) => setYeniGider({...yeniGider, altKategori: e.target.value})} className="w-full p-2 border border-purple-200 rounded bg-white text-sm text-purple-800">
                                                    <option value="İhtiyaç">İhtiyaç Kredisi</option>
                                                    <option value="Konut">Konut Kredisi</option>
                                                    <option value="Taşıt">Taşıt Kredisi</option>
                                                </select>
                                            </div>
                                        )}
                                        <div className="pt-2">
                                            <label className="flex items-center gap-2 p-2 border rounded-lg cursor-pointer hover:bg-slate-50"><input type="checkbox" checked={yeniGider.taksitli} onChange={(e) => setYeniGider({...yeniGider, taksitli: e.target.checked})} className="w-4 h-4 text-indigo-600" /><span className="text-xs font-medium text-slate-600">Taksitli İşlem</span></label>
                                            {yeniGider.taksitli && (
                                                <div className="bg-indigo-50 p-3 rounded-lg border border-indigo-100 mt-2">
                                                    <label className="block text-xs font-medium text-indigo-700 mb-1 flex items-center gap-1"><RefreshCw className="w-3 h-3" /> Taksit Sayısı</label>
                                                    <input type="number" min="2" max="120" value={yeniGider.taksitSayisi} onChange={(e) => setYeniGider({...yeniGider, taksitSayisi: e.target.value})} className="w-full p-2 border border-indigo-200 rounded" />
                                                </div>
                                            )}
                                        </div>
                                        <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition flex justify-center items-center gap-2"><Plus className="w-4 h-4" /> Ödeme Ekle</button>
                                    </div>
                                </form>
                            </div>

                            <div className="lg:col-span-2 space-y-4">
                                
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                    <div className="relative w-full sm:max-w-xs">
                                        <input 
                                            type="text" 
                                            placeholder="Tüm Aylarda Ödeme Ara (Başlık, Kategori...)" 
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value)}
                                            className="w-full p-2 pl-10 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500"
                                        />
                                        <Search className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 transform -translate-y-1/2" />
                                    </div>
                                    <button 
                                        onClick={exportToCsv} 
                                        className="bg-emerald-500 hover:bg-emerald-600 text-white font-medium py-2 px-4 rounded-lg transition flex items-center gap-2 text-sm w-full sm:w-auto"
                                    >
                                        <Download className="w-4 h-4" /> 
                                        Tümünü Dışa Aktar (CSV)
                                    </button>
                                </div>

                                {/* LİSTE GÖRÜNÜMÜ */}

                                {isGlobalSearchActive ? (
                                    <>
                                        <div className="flex justify-between items-end border-b border-slate-200 pb-2 pt-2">
                                            <h2 className="text-lg font-semibold text-slate-700">Arama Sonuçları (Tüm Aylar)</h2>
                                            <span className="text-sm text-slate-500">{globalFilteredGiderler.length} sonuç</span>
                                        </div>
                                        {globalFilteredGiderler.length === 0 ? (
                                            <div className="text-center py-10 bg-white rounded-xl border border-dashed border-slate-300">
                                                <p className="text-slate-400">Aradığınız kriterlere uygun kayıt tüm aylarda bulunamadı.</p>
                                            </div>
                                        ) : (
                                            <div className="space-y-3">
                                                {globalFilteredGiderler.map((gider) => (
                                                    <GiderSatiri
                                                        // Key'i benzersiz yapmak için id ve dateKey'i birleştiriyoruz
                                                        key={gider.id + gider.dateKey} 
                                                        gider={gider} 
                                                        // Düzenleme ID'si
                                                        editingId={editingId?.id}
                                                        editForm={editForm}
                                                        setEditForm={setEditForm}
                                                        saveEdit={saveEdit}
                                                        cancelEdit={cancelEdit}
                                                        startEditing={startEditing}
                                                        // İşlem yaparken, hangi aya ait olduğunu belirten dateKey'i gönderiyoruz
                                                        durumDegistir={(id) => durumDegistir(id, gider.dateKey)}
                                                        giderSil={(id) => giderSil(id, gider.dateKey)}
                                                        editInputRef={editInputRef}
                                                        formatPara={formatPara}
                                                        getKategoriRenk={getKategoriRenk}
                                                        isOverdue={checkOverdue(gider)}
                                                        isDueSoon={checkDueSoon(gider)}
                                                        dateKeyLabel={new Date(gider.dateKey + '-01').toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' })}
                                                    />
                                                ))}
                                            </div>
                                        )}
                                    </>
                                ) : (
                                    <>
                                        <div className="flex justify-between items-end border-b border-slate-200 pb-2 pt-2">
                                            <h2 className="text-lg font-semibold text-slate-700">Ödeme Listesi (Mevcut Ay)</h2>
                                            <span className="text-sm text-slate-500">{giderler.length} kalem</span>
                                        </div>
                                        
                                        {giderler.length === 0 ? (
                                            <div className="text-center py-10 bg-white rounded-xl border border-dashed border-slate-300">
                                                <p className="text-slate-400">Bu aya ait kayıt bulunamadı.</p>
                                            </div>
                                        ) : (
                                            <div className="space-y-3">
                                                {/* DİĞER KALEMLER */}
                                                {digerKalemler.map((gider) => (
                                                    <GiderSatiri 
                                                        key={gider.id} 
                                                        gider={gider} 
                                                        editingId={editingId?.id}
                                                        editForm={editForm}
                                                        setEditForm={setEditForm}
                                                        saveEdit={saveEdit}
                                                        cancelEdit={cancelEdit}
                                                        startEditing={startEditing}
                                                        // İşlem yaparken mevcut ayın dateKey'ini gönderiyoruz
                                                        durumDegistir={(id) => durumDegistir(id, getDateKey(seciliTarih))}
                                                        giderSil={(id) => giderSil(id, getDateKey(seciliTarih))}
                                                        editInputRef={editInputRef}
                                                        formatPara={formatPara}
                                                        getKategoriRenk={getKategoriRenk}
                                                        isOverdue={checkOverdue(gider)}
                                                        isDueSoon={checkDueSoon(gider)}
                                                    />
                                                ))}

                                                {/* SABİT FATURALAR (KAPANIR LİSTE) */}
                                                <div className="border border-slate-200 rounded-xl overflow-hidden bg-white mt-4">
                                                    <button onClick={() => setIsFaturalarOpen(!isFaturalarOpen)} className="w-full flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100 transition">
                                                        <div className="flex items-center gap-2 text-slate-700 font-semibold">
                                                            <Receipt className="w-5 h-5 text-indigo-500" />
                                                            <span>Sabit Faturalar</span>
                                                            <span className="text-xs font-normal text-slate-500 ml-2">({faturaKalemleri.length} kalem)</span>
                                                        </div>
                                                        <div className="flex items-center gap-3">
                                                            <span className="font-bold text-slate-600">{formatPara(faturaKalemleri.reduce((acc, val) => acc + val.tutar, 0))}</span>
                                                            {isFaturalarOpen ? <ChevronUp className="w-5 h-5 text-slate-400" /> : <ChevronDown className="w-5 h-5 text-slate-400" />}
                                                        </div>
                                                    </button>
                                                    {isFaturalarOpen && (
                                                        <div className="p-3 space-y-2 bg-slate-50/50 border-t border-slate-200">
                                                            {faturaKalemleri.map((gider) => (
                                                                <GiderSatiri 
                                                                    key={gider.id} 
                                                                    gider={gider} 
                                                                    editingId={editingId?.id}
                                                                    editForm={editForm}
                                                                    setEditForm={setEditForm}
                                                                    saveEdit={saveEdit}
                                                                    cancelEdit={cancelEdit}
                                                                    startEditing={startEditing}
                                                                    durumDegistir={(id) => durumDegistir(id, getDateKey(seciliTarih))}
                                                                    giderSil={(id) => giderSil(id, getDateKey(seciliTarih))}
                                                                    editInputRef={editInputRef}
                                                                    formatPara={formatPara}
                                                                    getKategoriRenk={getKategoriRenk}
                                                                    isOverdue={checkOverdue(gider)}
                                                                    isDueSoon={checkDueSoon(gider)}
                                                                />
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        )}
                                    </>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ButceTakip />);
    </script>
</body>
</html>
